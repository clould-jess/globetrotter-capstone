# This spins up ONLY the local Postgres database, not the app itself.
# The app runs via `npm run dev` on your host as usual. This is purely a
# convenience so you don't have to install Postgres natively.
version: "3.8"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: globetrotter
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: globetrotter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
