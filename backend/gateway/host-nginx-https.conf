server {
    listen 80;
    server_name cameroon-169-58-83-56.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cameroon-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://cameroon-169-58-83-56.sslip.io$request_uri; }
}

server {
    listen 443 ssl;
    server_name cameroon-169-58-83-56.sslip.io;
    ssl_certificate /etc/letsencrypt/live/cameroon-169-58-83-56.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cameroon-169-58-83-56.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 13m;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
    }
}
