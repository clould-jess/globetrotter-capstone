events {}

http {
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

  upstream user_service { server user-service:8000; }
  upstream itinerary_service { server itinerary-service:8000; }
  upstream discovery_service { server discovery-service:8000; }

  server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","service":"api-gateway"}';
    }

    location /api/v1/users {
      limit_req zone=api_limit burst=20 nodelay;
      rewrite ^/api/v1(/.*)$ $1 break;
      proxy_pass http://user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/itineraries {
      limit_req zone=api_limit burst=20 nodelay;
      rewrite ^/api/v1(/.*)$ $1 break;
      proxy_pass http://itinerary_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/discovery {
      limit_req zone=api_limit burst=30 nodelay;
      rewrite ^/api/v1/discovery(/.*)$ $1 break;
      proxy_pass http://discovery_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
