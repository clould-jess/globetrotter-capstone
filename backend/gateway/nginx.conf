events {}

http {
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

  upstream user_service { server user-service:8000; }
  upstream itinerary_service { server itinerary-service:8000; }
  upstream discovery_service { server discovery-service:8000; }
  upstream community_service { server community-service:8000; }
  upstream frontend { server web:3000; }

  server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","service":"api-gateway"}';
    }

    location = /_auth {
      internal;
      proxy_pass http://user_service/auth/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ {
      limit_req zone=api_limit burst=10 nodelay;
      rewrite ^/api/v1(/.*)$ $1 break;
      proxy_pass http://user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/admin/user-stats {
      auth_request /_auth;
      auth_request_set $auth_user_id $upstream_http_x_user_id;
      auth_request_set $auth_user_role $upstream_http_x_user_role;
      proxy_pass http://user_service/admin/stats;
      proxy_set_header X-User-ID $auth_user_id;
      proxy_set_header X-User-Role $auth_user_role;
    }

    location = /api/v1/admin/community-stats {
      auth_request /_auth;
      auth_request_set $auth_user_id $upstream_http_x_user_id;
      auth_request_set $auth_user_role $upstream_http_x_user_role;
      proxy_pass http://community_service/admin/stats;
      proxy_set_header X-User-ID $auth_user_id;
      proxy_set_header X-User-Role $auth_user_role;
    }

    location /api/v1/users {
      limit_req zone=api_limit burst=20 nodelay;
      auth_request /_auth;
      auth_request_set $auth_user_id $upstream_http_x_user_id;
      auth_request_set $auth_user_role $upstream_http_x_user_role;
      rewrite ^/api/v1(/.*)$ $1 break;
      proxy_pass http://user_service;
      proxy_set_header X-User-ID $auth_user_id;
      proxy_set_header X-User-Role $auth_user_role;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/discovery/admin {
      limit_req zone=api_limit burst=15 nodelay;
      auth_request /_auth;
      auth_request_set $auth_user_id $upstream_http_x_user_id;
      auth_request_set $auth_user_role $upstream_http_x_user_role;
      rewrite ^/api/v1/discovery(/.*)$ $1 break;
      proxy_pass http://discovery_service;
      proxy_set_header X-User-ID $auth_user_id;
      proxy_set_header X-User-Role $auth_user_role;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/itineraries {
      limit_req zone=api_limit burst=20 nodelay;
      auth_request /_auth;
      auth_request_set $auth_user_id $upstream_http_x_user_id;
      auth_request_set $auth_user_role $upstream_http_x_user_role;
      proxy_set_header X-User-ID $auth_user_id;
      proxy_set_header X-User-Role $auth_user_role;
      rewrite ^/api/v1(/.*)$ $1 break;
      proxy_pass http://itinerary_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/discovery {
      auth_request /_auth;
      limit_req zone=api_limit burst=30 nodelay;
      rewrite ^/api/v1/discovery(/.*)$ $1 break;
      proxy_pass http://discovery_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/community {
      client_max_body_size 13m;
      proxy_read_timeout 65s;
      limit_req zone=api_limit burst=30 nodelay;
      auth_request /_auth;
      auth_request_set $auth_user_id $upstream_http_x_user_id;
      auth_request_set $auth_user_role $upstream_http_x_user_role;
      auth_request_set $auth_display_name $upstream_http_x_user_display_name;
      rewrite ^/api/v1/community(/.*)$ $1 break;
      proxy_pass http://community_service;
      proxy_set_header X-User-ID $auth_user_id;
      proxy_set_header X-User-Role $auth_user_role;
      proxy_set_header X-User-Display-Name $auth_display_name;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /account {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      add_header Cache-Control "private, no-store" always;
    }

    location ~ ^/(?:assets/|_next/|fonts/|favicon\.) {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
    }

    location / {
      auth_request /_auth;
      error_page 401 = @login;
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      add_header Cache-Control "private, no-store" always;
    }

    location @login {
      return 302 /account;
    }
  }
}
