# Dedicated vhost on the existing Ubuntu host; does not replace other sites.
server {
    listen 80;
    server_name cameroon-169-58-83-56.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cameroon-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }
}
